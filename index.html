albumContentHTML += `

                vaultContainer.appendChild(albumWrapper);

            setupAudioControls();
        }

        function setupAudioControls() {
            const allAudios = document.querySelectorAll('audio');

            allAudios.forEach(audio => {
                const trackCard = audio.closest('.track-card');

                audio.addEventListener('play', () => {
                    allAudios.forEach(otherAudio => {
                        if (otherAudio !== audio) {
                            otherAudio.pause();
                            otherAudio.closest('.track-card').classList.remove('playing');
                        }
                    });
                    trackCard.classList.add('playing');
                });

                audio.addEventListener('pause', () => {
                    trackCard.classList.remove('playing');
                });

                audio.addEventListener('ended', () => {
                    trackCard.classList.remove('playing');
                });
            });
        }

        document.addEventListener('DOMContentLoaded', renderDiscography);
    </script>
